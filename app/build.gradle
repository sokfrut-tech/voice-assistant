plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sokfrut.voiceassistant'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sokfrut.voiceassistant'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2'

        // Телефон OPPO Find X6 Pro — arm64. Так APK получается заметно меньше.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Офлайн-распознавание речи
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
