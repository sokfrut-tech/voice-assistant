name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Закреплена версия: на ubuntu-24.04 Android SDK уже установлен.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK (licenses and platform 34)
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > sdk.log 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" >> sdk.log 2>&1 || {
            msg=$(tail -n 40 sdk.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=SDK setup failed::$msg"
            exit 1
          }

      - name: Security check of manifest
        run: |
          M=app/src/main/AndroidManifest.xml
          fail=0
          if grep -q 'android:debuggable="true"' "$M"; then echo "::error::debuggable=true in manifest"; fail=1; fi
          if grep -q 'usesCleartextTraffic="true"' "$M"; then echo "::error::cleartext traffic allowed"; fail=1; fi
          echo "Permissions requested:"
          grep -o 'android.permission.[A-Z_]*' "$M" | sort -u
          exit $fail

      - name: Lint
        run: |
          set -o pipefail
          gradle lintDebug --no-daemon 2>&1 | tee lint.log || {
            msg=$(tail -n 60 lint.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Lint failed::$msg"
            exit 1
          }

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            msg=$(tail -n 60 build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases (test build)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk voice-assistant-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug voice-assistant-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Тестовая сборка" \
            --notes "Автоматическая отладочная сборка (debug). Коммит ${{ github.sha }}."
